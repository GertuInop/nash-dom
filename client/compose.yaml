# Отдельный запуск только фронта (статика).
# API должен быть доступен на том же origin через корневой Caddy,
# либо используйте полный стек из корня: docker compose up
services:
  web:
    build: .
    container_name: nash-dom-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"

networks:
  default:
    name: nash-dom-web-net
