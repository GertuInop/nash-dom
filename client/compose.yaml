services:
  web:
    build: .
    container_name: nash-dom-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    environment:
      # Куда nginx проксирует /server (отдельный запуск без Caddy)
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:3080}
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: nash-dom-web-net
