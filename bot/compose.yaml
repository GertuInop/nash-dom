# Устаревший compose из bot/. Запускайте из КОРНЯ: docker compose up
# Использует корневой ../.env

services:
  mysql:
    image: mysql:8.4
    container_name: nash-dom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nash_dom}
      MYSQL_USER: ${MYSQL_USER:-nash_dom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nash_dom}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    container_name: nash-dom-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-nash_dom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nash_dom}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nash_dom}
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      CONSENT_URL: ${CONSENT_URL:-}
      API_PORT: ${API_PORT:-3080}
      DOMAIN: ${DOMAIN:-localhost}
      BOT_MODE: ${BOT_MODE:-auto}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MINIAPP_URL: ${MINIAPP_URL:-}
      MAX_INITDATA_RELAXED: ${MAX_INITDATA_RELAXED:-1}
      NODE_EXTRA_CA_CERTS: /app/certs/russian_trusted_ca_bundle.pem
    expose:
      - "3080"
    ports:
      - "${API_PUBLISH_PORT:-3080}:3080"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ../client
    container_name: nash-dom-web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - bot

  caddy:
    image: caddy:2.8-alpine
    container_name: nash-dom-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SITE_ADDRESS: ${SITE_ADDRESS:-http://127.0.0.1, http://localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
      - web

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
